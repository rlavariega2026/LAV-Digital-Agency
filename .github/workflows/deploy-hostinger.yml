name: Deploy LAV Digital MKT to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/deploy-hostinger.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lav-digital-mkt-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish and verify LAV Digital MKT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment folder
        run: |
          mkdir -p deploy
          cp index.html deploy/index.html

      - name: Inspect existing image assets on Hostinger without changing them
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          npm init -y >/dev/null 2>&1
          npm install basic-ftp >/dev/null 2>&1
          node --input-type=module <<'NODE'
          import ftp from 'basic-ftp';
          const c = new ftp.Client(20000);
          try {
            await c.access({host:process.env.FTP_SERVER,user:process.env.FTP_USERNAME,password:process.env.FTP_PASSWORD,port:Number(process.env.FTP_PORT||21),secure:false});
            for (const dir of ['/domains/lavdigitalagency.com/public_html/','/domains/lavdigitalagency.com/public_html/assets/','/domains/lavdigitalagency.com/public_html/images/','/domains/lavdigitalagency.com/public_html/assets/servicios/']) {
              try {
                const list=await c.list(dir);
                console.log('REMOTE_DIR '+dir);
                for (const x of list) console.log((x.isDirectory?'DIR ':'FILE ')+x.name);
              } catch(e) { console.log('REMOTE_DIR_UNAVAILABLE '+dir+' '+e.message); }
            }
          } finally { c.close(); }
          NODE

      - name: Publish index.html to the verified Hostinger document root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./deploy/
          # Verified by FTP directory listing as the document root serving lavdigitalagency.com.
          server-dir: /domains/lavdigitalagency.com/public_html/
          dangerous-clean-slate: false
          log-level: verbose

      - name: Verify the public website received this exact landing page
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 25 \
            -H 'Cache-Control: no-cache, no-store' \
            "https://lavdigitalagency.com/?deployment_check=${GITHUB_SHA}" \
            -o live-index.html
          if grep -q 'LAV landing deployment target corrected' live-index.html; then
            echo "PUBLIC_DEPLOYMENT_VERIFIED"
          else
            echo "Public title:"
            grep -Eio '<title>[^<]*</title>' live-index.html | head -1 || true
            echo "Public response SHA:"
            sha256sum live-index.html
            echo "::error::The public domain is not serving the newly published index.html."
            exit 1
          fi

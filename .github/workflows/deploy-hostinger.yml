name: Deploy LAV Digital MKT to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/deploy-hostinger.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lav-digital-mkt-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish and verify landing page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment folder
        run: |
          mkdir -p deploy
          cp index.html deploy/index.html

      - name: Upload landing page to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./deploy/
          # Exact destination supplied for lavdigitalagency.com in Hostinger.
          server-dir: lavdigitalagency.com/public_html/
          dangerous-clean-slate: false
          log-level: verbose

      - name: Verify the public website received this exact version
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          URL="https://lavdigitalagency.com/?deployment_check=${EXPECTED_SHA}"
          for attempt in 1 2 3 4 5; do
            echo "Public verification attempt ${attempt}/5"
            if curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache, no-store' \
              "${URL}" -o live-index.html; then
              if grep -q 'LAV landing deployment target corrected' live-index.html; then
                echo "Verified: the public website is serving the updated landing page."
                exit 0
              fi
            fi
            sleep 3
          done
          echo "::error::FTP upload completed, but the public website is not serving the updated index.html."
          exit 1

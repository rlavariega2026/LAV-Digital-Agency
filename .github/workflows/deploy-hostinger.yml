name: Deploy LAV Digital MKT to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/deploy-hostinger.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lav-digital-mkt-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish landing page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose FTP directory structure
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set +x
          for path in "" "public_html/" "domains/" "domains/lavdigitalagency.com/" "domains/lavdigitalagency.com/public_html/" "lavdigitalagency.com/" "lavdigitalagency.com/public_html/"; do
            echo "===== FTP path: /${path} ====="
            curl --silent --show-error --list-only --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER:$FTP_PORT/${path}" || echo "[No se pudo listar esta ruta]"
          done

      - name: Prepare deployment folder
        run: |
          mkdir -p deploy
          cp index.html deploy/index.html

      - name: Upload landing page to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./deploy/
          # Explicit Hostinger destination provided for this site.
          server-dir: lavdigitalagency.com/public_html/
          dangerous-clean-slate: false
          log-level: standard
